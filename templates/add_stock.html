{% extends 'base.html' %}

{% block title %}Add Stock - Scent Room IMS{% endblock %}

{% block content %}
    <h2>Add New Stock Item</h2>
    <form method="POST">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="{{ name or '' }}" required>
        </div>
        <div>
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" value="{{ quantity or '' }}" min="0" required>
        </div>
        <div>
            <label for="price">Price (#):</label> {# Assuming Euro #}
            <input type="number" step="0.01" id="price" name="price" value="{{ price or '' }}" min="0" required>
        </div>
        <div>
            <input type="submit" value="Add Stock Item">
        </div>
    </form>
{% endblock %}
